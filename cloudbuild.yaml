steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=BUILDPLATFORM=linux/amd64'
      - '--build-arg=USE_SLIM=true'
      - '-t'
      - 'us-central1-docker.pkg.dev/stackguardian-nonprod/rome-registry/open-webui:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'

images:
  - 'us-central1-docker.pkg.dev/stackguardian-nonprod/rome-registry/open-webui:latest'

options:
  logging: CLOUD_LOGGING_ONLY
